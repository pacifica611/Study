<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Study Loop</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-layout">
      <aside class="sidebar glass">
        <div class="brand">
          <h1>Study Loop</h1>
          <p>오늘 해야 할 공부를 자동으로.</p>
        </div>

        <nav class="sidebar-tabs">
          <button class="tab active" data-tab="today">오늘</button>
          <button class="tab" data-tab="problems">문제</button>
          <button class="tab" data-tab="planner">플래너</button>
          <button class="tab" data-tab="report">리포트</button>
        </nav>

        <section class="sidebar-summary">
          <h3>오늘 요약</h3>
          <ul id="quickSummary">
            <li>PlanBlock: 0개</li>
            <li>완료: 0개</li>
            <li>순공: 0분</li>
          </ul>
        </section>
      </aside>

      <div class="main-panel">
        <header class="topbar glass">
          <div>
            <h2>학습 운영 대시보드</h2>
            <p class="subtitle">해야 할 것 → 시작 → 기록 → 자동 반영</p>
          </div>
          <button id="generatePlanBtn" class="btn primary">자동 계획 생성</button>
        </header>

        <main>
          <section id="today" class="view active">
            <div class="card glass">
              <h2>오늘 타임라인 (PlanBlock)</h2>
              <div id="timeline" class="timeline"></div>
            </div>
          </section>

          <section id="problems" class="view">
            <div class="grid">
              <div class="card glass">
                <h2>문제 추가</h2>
                <form id="problemForm" class="form">
                  <input name="book" placeholder="문제집" required />
                  <input name="no" placeholder="번호" required />
                  <input name="subject" placeholder="과목" required />
                  <input name="tags" placeholder="태그(쉼표 구분)" />
                  <textarea name="note" placeholder="오답 포인트 / 메모"></textarea>
                  <label class="small">문제 사진 업로드(카메라 가능)</label>
                  <input name="photo" type="file" accept="image/*" capture="environment" />
                  <img id="photoPreview" class="photo-preview hidden" alt="문제 사진 미리보기" />
                  <button class="btn primary" type="submit">저장</button>
                </form>
              </div>
              <div class="card glass">
                <h2>문제 목록 (∞ / ★ / /)</h2>
                <div id="problemList" class="problem-list"></div>
              </div>
            </div>
          </section>

          <section id="planner" class="view">
            <div class="grid planner-grid">
              <div class="card glass">
                <h2>달력 플래너</h2>
                <div class="planner-toolbar">
                  <button id="prevMonthBtn" class="btn ghost" type="button">◀</button>
                  <strong id="calendarTitle"></strong>
                  <button id="nextMonthBtn" class="btn ghost" type="button">▶</button>
                </div>
                <div id="calendarGrid" class="calendar-grid"></div>
              </div>

              <div class="card glass">
                <h2>할 일(Task) 추가</h2>
                <form id="taskForm" class="form">
                  <input name="title" placeholder="할 일" required />
                  <input name="subject" placeholder="과목" required />
                  <input name="minutes" type="number" min="25" step="25" placeholder="예상 시간(분)" required />
                  <input name="due" type="date" />
                  <label class="small">계획 주기</label>
                  <select name="planCycle">
                    <option value="daily">매일</option>
                    <option value="weekly">매주</option>
                    <option value="monthly">매월</option>
                  </select>
                  <label class="small">기준 날짜</label>
                  <input name="planDate" type="date" />
                  <select name="priority">
                    <option value="1">우선순위 낮음</option>
                    <option value="2" selected>우선순위 중간</option>
                    <option value="3">우선순위 높음</option>
                  </select>
                  <button class="btn primary" type="submit">Task 저장</button>
                </form>
              </div>
            </div>
            <div class="card glass">
              <h2>Task 백로그</h2>
              <div class="planner-cycle-tabs">
                <button class="cycle-tab active" data-cycle="daily">매일</button>
                <button class="cycle-tab" data-cycle="weekly">매주</button>
                <button class="cycle-tab" data-cycle="monthly">매월</button>
              </div>
              <div id="taskList"></div>
            </div>
          </section>

          <section id="report" class="view">
            <div class="card glass">
              <h2>데일리 리포트</h2>
              <div id="reportBody"></div>
            </div>
          </section>
        </main>
      </div>
    </div>

    <template id="timelineItemTemplate">
      <article class="timeline-item">
        <div class="meta"></div>
        <h3></h3>
        <p class="status"></p>
        <div class="actions"></div>
      </article>
    </template>

    <script src="app.js"></script>
  </body>
</html>
