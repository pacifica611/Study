<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudyOS App</title>
    <meta name="description" content="실제로 작동하는 StudyOS 학습 루프 웹앱" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="bg-body-tertiary">
    <header class="border-bottom bg-white">
      <div class="container py-3 d-flex align-items-center justify-content-between">
        <h1 class="h4 mb-0 fw-bold text-primary">StudyOS</h1>
        <button id="resetData" class="btn btn-outline-danger btn-sm" type="button">데이터 초기화</button>
      </div>
    </header>

    <main class="container py-3 py-md-4">
      <section id="summary" class="row g-2 g-md-3 mb-3"></section>

      <nav class="row g-2 mb-3" aria-label="메인 탭">
        <div class="col-6 col-md-3"><button class="tab btn btn-outline-primary w-100 active" data-tab="today">오늘</button></div>
        <div class="col-6 col-md-3"><button class="tab btn btn-outline-primary w-100" data-tab="planner">플래너</button></div>
        <div class="col-6 col-md-3"><button class="tab btn btn-outline-primary w-100" data-tab="problems">문제 루프</button></div>
        <div class="col-6 col-md-3"><button class="tab btn btn-outline-primary w-100" data-tab="report">리포트</button></div>
      </nav>

      <section id="today" class="panel active">
        <div class="card shadow-sm">
          <div class="card-body">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
              <h2 class="h5 mb-0">오늘 PlanBlock</h2>
              <button id="generateBlocks" class="btn btn-primary btn-sm">블록 생성</button>
            </div>
            <ul id="blockList" class="list-group list-group-flush"></ul>
          </div>
        </div>
      </section>

      <section id="planner" class="panel">
        <div class="card shadow-sm">
          <div class="card-body">
            <h2 class="h5 mb-3">Task 추가</h2>
            <form id="taskForm" class="row g-2 mb-3">
              <div class="col-12 col-md-5"><input class="form-control" name="title" placeholder="할 일" required /></div>
              <div class="col-6 col-md-3"><input class="form-control" name="subject" placeholder="과목" required /></div>
              <div class="col-6 col-md-2"><input class="form-control" type="number" min="10" step="5" name="minutes" placeholder="시간(분)" required /></div>
              <div class="col-12 col-md-2 d-grid"><button class="btn btn-primary">저장</button></div>
            </form>
            <ul id="taskList" class="list-group list-group-flush"></ul>
          </div>
        </div>
      </section>

      <section id="problems" class="panel">
        <div class="card shadow-sm">
          <div class="card-body">
            <h2 class="h5 mb-3">문제 루프 (∞/★//)</h2>
            <form id="problemForm" class="row g-2 mb-3">
              <div class="col-12 col-md-5"><input class="form-control" name="title" placeholder="문제명" required /></div>
              <div class="col-6 col-md-3"><input class="form-control" name="subject" placeholder="과목" required /></div>
              <div class="col-6 col-md-2"><input class="form-control" name="book" placeholder="문제집" /></div>
              <div class="col-12 col-md-2 d-grid"><button class="btn btn-primary">저장</button></div>
            </form>
            <ul id="problemList" class="list-group list-group-flush"></ul>
          </div>
        </div>
      </section>

      <section id="report" class="panel">
        <div class="card shadow-sm">
          <div class="card-body">
            <h2 class="h5 mb-3">학습 리포트</h2>
            <div id="reportBody"></div>
          </div>
        </div>
      </section>
    </main>

    <template id="itemTpl">
      <li class="list-group-item px-0">
        <div class="d-flex flex-column flex-md-row justify-content-between gap-2">
          <div class="item-body">
            <strong class="name"></strong>
            <p class="meta mb-0"></p>
            <p class="submeta mb-0"></p>
          </div>
          <div class="d-flex flex-wrap gap-1 actions"></div>
        </div>
      </li>
    </template>

    <script src="script.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
